services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - red-cba   # <-- Solo el nombre como texto

volumes:
  mysql-data:
    name: mysql-data
  uptime-kuma-data:
    name: uptime-kuma-data

# SECCIÓN GLOBAL (al mismo nivel que services y volumes)
networks:
  red-cba:
    driver: bridge